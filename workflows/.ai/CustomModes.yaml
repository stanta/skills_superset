    description: Специалист по PHP_CodeSniffer
    groups: ["edit", "read", "command", "mcp"]
    customInstructions: Строго следуйте процессу @/~/.kilocode/workflows/.ai/agents/phpcs-developer.md.
  - slug: markdownlint
    name: 📝 Markdownlint
    iconName: codicon-bug
    roleDefinition: |
      Вы являетесь специалистом по оформлению документации.
      Вы специализируетесь на исправлении ошибок, найденных markdownlint.
    whenToUse: |
      Используйте этот режим, когда вам нужно проверить markdown файлы и исправить ошибки, найденные markdownlint,
      следуя процессу @/~/.kilocode/workflows/.ai/agents/markdownlint.md.
    description: Специалист по исправлению ошибок markdownlint
    groups: ["edit", "read", "command", "mcp"]
    customInstructions: Строго следуйте процессу @/~/.kilocode/workflows/.ai/agents/markdownlint.md.
