name: One-time import OpenAI plugin skills

on:
  push:
    branches:
      - import/openai-plugin-skills-20260923
    paths:
      - '.github/workflows/one-time-import-openai-plugin-skills.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: import/openai-plugin-skills-20260923

      - name: Checkout pinned OpenAI plugins source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/openai/plugins.git /tmp/openai-plugins
          git -C /tmp/openai-plugins checkout 1dc195897af4161d039b80d8471ec0a10c9bbc89

      - name: Import new skill packages without overwriting local skills
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import shutil
          from collections import Counter
          from pathlib import Path

          source_root = Path("/tmp/openai-plugins/plugins")
          target_root = Path("skills")
          manifest_path = Path("docs/imports/openai-plugins-skills.json")
          workflow_path = Path(".github/workflows/one-time-import-openai-plugin-skills.yml")

          entries = []
          for plugin_dir in sorted(p for p in source_root.iterdir() if p.is_dir()):
              skills_dir = plugin_dir / "skills"
              if not skills_dir.is_dir():
                  continue
              for skill_dir in sorted(p for p in skills_dir.iterdir() if p.is_dir()):
                  if not ((skill_dir / "SKILL.md").is_file() or (skill_dir / "skill.md").is_file()):
                      continue
                  entries.append((plugin_dir.name, skill_dir.name, skill_dir))

          slug_counts = Counter(slug for _, slug, _ in entries)
          existing_names = {p.name for p in target_root.iterdir() if p.is_dir()}

          imported = []
          skipped_existing = []
          renamed = []

          for plugin, slug, src in entries:
              if slug_counts[slug] == 1 and slug not in existing_names:
                  dest_slug = slug
                  reason = "unique"
              else:
                  dest_slug = f"{plugin}-{slug}"
                  reason = "source-duplicate" if slug_counts[slug] > 1 else "target-collision"

              dst = target_root / dest_slug
              item = {
                  "plugin": plugin,
                  "source_skill": slug,
                  "target_skill": dest_slug,
                  "reason": reason,
              }

              if dst.exists():
                  skipped_existing.append(item)
                  continue

              shutil.copytree(
                  src,
                  dst,
                  symlinks=True,
                  ignore=shutil.ignore_patterns(".DS_Store", "__pycache__", "*.pyc"),
              )
              imported.append(item)
              if dest_slug != slug:
                  renamed.append(item)

          if len(entries) != 502:
              raise SystemExit(f"Expected 502 top-level skills at pinned source commit, found {len(entries)}")

          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          manifest = {
              "source_repository": "https://github.com/openai/plugins",
              "source_commit": "1dc195897af4161d039b80d8471ec0a10c9bbc89",
              "source_skill_count": len(entries),
              "imported_count": len(imported),
              "skipped_existing_count": len(skipped_existing),
              "renamed_for_collision_count": len(renamed),
              "imported": imported,
              "skipped_existing": skipped_existing,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          workflow_path.unlink()

          print(json.dumps({
              "source_skill_count": len(entries),
              "imported_count": len(imported),
              "skipped_existing_count": len(skipped_existing),
              "renamed_for_collision_count": len(renamed),
          }, indent=2))
          PY

      - name: Commit imported skills
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills docs/imports/openai-plugins-skills.json .github/workflows/one-time-import-openai-plugin-skills.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(skills): import OpenAI plugin skill suite"
          git push origin HEAD:import/openai-plugin-skills-20260923
