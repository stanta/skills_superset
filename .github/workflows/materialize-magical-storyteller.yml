name: Materialize approved magical-storyteller package
on:
  push:
    branches: [feat/magical-storyteller]
    paths: [.magical-storyteller.patch.xz]
permissions:
  contents: write
concurrency:
  group: materialize-magical-storyteller
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'stanta/skills_superset' && github.ref == 'refs/heads/feat/magical-storyteller'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/magical-storyteller
      - name: Verify and apply the approved package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ad956d3326108d5d696af31964970a973d118f8f HEAD
          python - <<'PY'
          import hashlib
          import lzma
          import pathlib
          import re
          import subprocess
          import tempfile
          payload = pathlib.Path('.magical-storyteller.patch.xz').read_bytes()
          assert hashlib.sha256(payload).hexdigest() == 'f900de2c30453c17150b424c157e4988e2e09724219cb1489938a9d358b90cc3', 'Compressed payload checksum mismatch'
          patch = lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest() == 'ddfd345b4e46717453ee6f3f1b85e23a1eeadec1a529cf3cdaefbbcb0c01b180', 'Patch checksum mismatch'
          navigation = {'README.md', 'docs/metaskills.md', 'skills/meta-narrative-worldbuilding/SKILL.md', 'skills/meta-media-production/SKILL.md', 'skills/meta-narrative-worldbuilding/references/members.md', 'skills/meta-media-production/references/members.md', 'skills/meta-specialist-catalog/references/legacy-names.md'}
          paths = re.findall(r'^diff --git a/(\S+) b/(\S+)$', patch.decode('utf-8'), re.M)
          assert len(paths) == 22 and len({a for a, _ in paths}) == 22, 'Unexpected file count'
          assert all(a == b and '..' not in pathlib.PurePosixPath(a).parts and (a in navigation or a.startswith('atomic-skills/magical-storyteller/')) for a, b in paths), 'Out-of-scope patch path'
          assert sum(a in navigation for a, _ in paths) == 7
          assert not pathlib.Path('atomic-skills/magical-storyteller').exists(), 'Skill already exists; refusing to overwrite'
          with tempfile.NamedTemporaryFile(suffix='.patch') as f:
              f.write(patch)
              f.flush()
              subprocess.run(['git', 'apply', '--check', f.name], check=True)
              subprocess.run(['git', 'apply', f.name], check=True)
          PY
      - name: Validate the package and repository navigation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s atomic-skills/magical-storyteller/tests -v
          python -m unittest discover -s discovery -p 'test_*.py' -v
          python discovery/validate_metaskills.py
          git diff --check
      - name: Remove import helpers and commit only the requested files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-magical-storyteller.yml .magical-storyteller.patch.xz
          git add atomic-skills/magical-storyteller README.md docs/metaskills.md skills/meta-narrative-worldbuilding/SKILL.md skills/meta-media-production/SKILL.md skills/meta-narrative-worldbuilding/references/members.md skills/meta-media-production/references/members.md skills/meta-specialist-catalog/references/legacy-names.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add magical-storyteller skill and navigation; remove one-time import helpers'
          git push origin HEAD:refs/heads/feat/magical-storyteller
