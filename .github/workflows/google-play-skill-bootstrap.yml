name: Register Google Play skill navigation (one-time)
on:
  push:
    branches: [skills/google-play-publishing-20261015]
    paths:
      - atomic-skills/google-play-publishing/**
      - discovery/test_google_play_publishing.py
      - .github/workflows/google-play-skill-bootstrap.yml
permissions:
  contents: read
concurrency:
  group: google-play-skill-registration
  cancel-in-progress: false
jobs:
  register:
    if: github.repository == 'stanta/skills_superset' && github.ref == 'refs/heads/skills/google-play-publishing-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: skills/google-play-publishing-20261015
          fetch-depth: 1
      - name: Register static navigation without replacing unrelated content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          sid = 'google-play-publishing'
          owners = ['meta-devops-cloud', 'meta-mobile-desktop']
          marker = f'- **{sid}**'
          description = 'Prepare, audit and optimize Google Play app/game releases across frameworks: account gates, signing, policy, tests, review, CI and recovery.'

          def insert_entry(path, entry):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              existing = [line for line in lines if line.startswith(marker)]
              if existing:
                  assert existing == [entry], f'Conflicting registration in {path}'
                  return text
              positions = [i for i, line in enumerate(lines) if line.startswith('- **')]
              assert positions, f'No entries in {path}'
              position = next((i for i in positions if lines[i][4:].split('**', 1)[0] > sid), positions[-1] + 1)
              lines.insert(position, entry)
              return '\n'.join(lines) + '\n'

          for owner in owners:
              catalog = Path('skills') / owner / 'references/members.md'
              entry = f'{marker} — {description} — `../../../atomic-skills/{sid}/SKILL.md`'
              text = insert_entry(catalog, entry)
              count = sum(line.startswith('- **') for line in text.splitlines())
              text, changed = re.subn(r'(?m)^\d+ atomic skills\.', f'{count} atomic skills.', text, count=1)
              assert changed == 1, f'Missing count in {catalog}'
              catalog.write_text(text, encoding='utf-8')

              meta = Path('skills') / owner / 'SKILL.md'
              text = meta.read_text(encoding='utf-8')
              if sid not in text:
                  delimiter = '\n---\n\n# '
                  assert text.count(delimiter) == 1, f'Unexpected frontmatter in {meta}'
                  scope = '\n  Additional scope: Google Play app and game publication, release readiness, policy gates, Android signing, test tracks, submission automation and store optimization.'
                  text = text.replace(delimiter, scope + delimiter, 1)
                  heading = '## Typical decomposition\n'
                  assert text.count(heading) == 1, f'Missing route heading in {meta}'
                  route = f'\n- Google Play publication or update: read `../../atomic-skills/{sid}/SKILL.md` as Start; select framework, security, payment or performance support only when applicable. No particular product or stack is assumed.\n'
                  text = text.replace(heading, heading + route, 1)
                  meta.write_text(text, encoding='utf-8')

          registry = Path('skills/meta-specialist-catalog/references/legacy-names.md')
          entry = f"{marker} — {', '.join(owners)} — `../../../atomic-skills/{sid}/SKILL.md`"
          registry.write_text(insert_entry(registry, entry), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          heading = '## Compatibility and maintenance\n'
          if '## Google Play publishing\n' not in text:
              assert text.count(heading) == 1
              section = ('## Google Play publishing\n\n'
                  'For Android app/game release readiness, Play Console onboarding, signing, current policy gates, testing, review, CI and store optimization, use '
                  '[google-play-publishing](atomic-skills/google-play-publishing/SKILL.md). '
                  'It is framework- and project-neutral and is discoverable through `meta-mobile-desktop` and `meta-devops-cloud`. '
                  'Health, AI, children, billing and restricted permissions are conditional modules, not assumptions about the product. '
                  'See the [Russian practical guide](docs/guides/google-play-publishing.md) and the skill\'s dated source ledger; recheck volatile rules before submission.\n\n')
              readme.write_text(text.replace(heading, section + heading, 1), encoding='utf-8')

          doc = Path('docs/metaskills.md')
          text = doc.read_text(encoding='utf-8')
          if '## Google Play release routing\n' not in text:
              text += ('\n## Google Play release routing\n\n'
                  'Google Play publishing and release automation route through `meta-mobile-desktop` and `meta-devops-cloud` to '
                  '[google-play-publishing](../atomic-skills/google-play-publishing/SKILL.md). '
                  'Both member catalogs and the exact-name registry contain the canonical atomic path. '
                  'The skill is not tied to a product, framework, publisher account or country; it selects only applicable policy modules. '
                  'Its source snapshot is dated and must be refreshed before a submission. '
                  'The [practical guide](guides/google-play-publishing.md) is for human readers. '
                  'Maintainer structural tests do not constitute behavioral evaluation or Play approval.\n')
              doc.write_text(text, encoding='utf-8')
          PY
      - name: Remove this one-time workflow from the resulting branch
        run: rm .github/workflows/google-play-skill-bootstrap.yml
      - name: Validate paths, templates and full repository catalogs
        run: |
          python3 -m unittest discover -s discovery -p 'test_*.py' -v
          python3 discovery/validate_metaskills.py
          git diff --check
      - name: Commit only navigation and self-removal to this isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin skills/google-play-publishing-20261015
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git add README.md docs/metaskills.md \
            skills/meta-mobile-desktop/SKILL.md \
            skills/meta-mobile-desktop/references/members.md \
            skills/meta-devops-cloud/SKILL.md \
            skills/meta-devops-cloud/references/members.md \
            skills/meta-specialist-catalog/references/legacy-names.md \
            .github/workflows/google-play-skill-bootstrap.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Register universal Google Play publishing skill in meta catalogs and navigation'
          git push origin HEAD:refs/heads/skills/google-play-publishing-20261015
