name: Validate meta-only skill discovery
on:
  push:
    branches: [metaskills]
    paths:
      - "skills/**"
      - "atomic-skills/**"
      - "discovery/validate_metaskills.py"
      - "discovery/test_relative_paths.py"
      - "README.md"
      - "docs/metaskills.md"
      - ".github/workflows/metaskills.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Path resolution regression tests (CI only)
        run: python -m unittest discover -s discovery -p 'test_*.py' -v
      - name: Verify all meta catalog and legacy references (CI only)
        run: python discovery/validate_metaskills.py
