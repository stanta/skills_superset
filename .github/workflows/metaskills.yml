name: Validate meta-only skill discovery
on:
  push:
    branches: [metaskills]
    paths:
      - "skills/**"
      - "atomic-skills/**"
      - "discovery/validate_metaskills.py"
      - ".github/workflows/metaskills.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify first-level isolation and static catalogs (CI only)
        run: python discovery/validate_metaskills.py
