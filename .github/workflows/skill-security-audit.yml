name: Skill security audit

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/skill-security-audit.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/skill-security-audit.yml'

permissions:
  contents: read

concurrency:
  group: skill-security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2 pinned to a full immutable commit SHA.
      - name: Checkout candidate revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run auditor unit tests
        shell: bash
        run: python3 -m unittest skills/skill-security-auditor/scripts/test_audit_skill.py

      - name: Validate security capability manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          errors = []
          valid_tiers = {"S0", "S1", "S2", "S3"}
          for skill_md in sorted(Path("skills").glob("*/SKILL.md")):
              manifest_path = skill_md.parent / "security-manifest.json"
              if not manifest_path.exists():
                  errors.append(f"{skill_md.parent}: missing security-manifest.json")
                  continue
              try:
                  data = json.loads(manifest_path.read_text())
              except Exception as exc:
                  errors.append(f"{manifest_path}: invalid JSON: {exc}")
                  continue
              if data.get("version") != 1:
                  errors.append(f"{manifest_path}: version must be 1")
              if data.get("risk_tier") not in valid_tiers:
                  errors.append(f"{manifest_path}: invalid risk_tier")
              caps = data.get("capabilities")
              if not isinstance(caps, dict):
                  errors.append(f"{manifest_path}: capabilities must be an object")
                  continue
              for key in ("filesystem_read","filesystem_write","network_hosts","shell_commands","tools","requires_human_approval"):
                  if key in caps and not isinstance(caps[key], list):
                      errors.append(f"{manifest_path}: capabilities.{key} must be an array")

          if errors:
              raise SystemExit("\n".join(errors))
          print("All skill security manifests are present and structurally valid.")
          PY

      - name: Select trusted auditor and audit changed skills (pull request)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/trusted-skill-auditor
          mkdir -p /tmp/trusted-skill-auditor

          if git cat-file -e "${BASE_SHA}:skills/skill-security-auditor/scripts/audit_skill.py" 2>/dev/null; then
            git archive "${BASE_SHA}" skills/skill-security-auditor | tar -x -C /tmp/trusted-skill-auditor
            AUDITOR=/tmp/trusted-skill-auditor/skills/skill-security-auditor/scripts/audit_skill.py
          else
            AUDITOR=skills/skill-security-auditor/scripts/audit_skill.py
            echo 'Bootstrap mode: base revision has no auditor yet; independent review is required.'
          fi

          python3 "${AUDITOR}"             --repo-root .             --changed-from "${BASE_SHA}"             --changed-to "${HEAD_SHA}"             --fail-on high             --report /tmp/skill-security-report.json

          cat /tmp/skill-security-report.json

      - name: Audit changed skills (push)
        if: github.event_name == 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 skills/skill-security-auditor/scripts/audit_skill.py             --repo-root .             --changed-from "${BASE_SHA}"             --changed-to "${HEAD_SHA}"             --fail-on high             --report /tmp/skill-security-report.json
          cat /tmp/skill-security-report.json
