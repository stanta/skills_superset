name: Skill security audit

on:
  pull_request:
    paths:
      - "skills/**"
      - "atomic-skills/**"
      - "security/skills-security-inventory.json"
      - ".github/workflows/skill-security-audit.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "atomic-skills/**"
      - "security/skills-security-inventory.json"
      - ".github/workflows/skill-security-audit.yml"

permissions:
  contents: read

concurrency:
  group: skill-security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2 pinned to a full immutable commit SHA.
      - name: Checkout candidate revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run auditor unit tests
        shell: bash
        run: python3 -m unittest atomic-skills/skill-security-auditor/scripts/test_audit_skill.py

      - name: Validate security capability manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          errors = []
          valid_tiers = {"S0", "S1", "S2", "S3"}
          inventory = json.loads(Path("security/skills-security-inventory.json").read_text())
          if inventory.get("skill_root") != "atomic-skills":
              raise SystemExit("Inventory must identify the atomic-skills root")
          entries = inventory["skills"]
          required = set()
          for entry in entries:
              name = entry["skill"]
              if not isinstance(name, str) or not name or Path(name).name != name or name in {".", ".."}:
                  raise SystemExit(f"Invalid inventory skill ID: {name!r}")
              required.add(Path("atomic-skills") / name / "SKILL.md")
          if len(required) != len(entries):
              raise SystemExit("Duplicate inventory skill IDs")
          all_skills = set(Path("skills").rglob("SKILL.md")) | set(Path("atomic-skills").rglob("SKILL.md"))
          for missing in sorted(required - all_skills):
              errors.append(f"{missing}: inventory skill is missing")
          manifested = 0
          for skill_md in sorted(all_skills):
              manifest_path = skill_md.parent / "security-manifest.json"
              if not manifest_path.exists():
                  if skill_md in required:
                      errors.append(f"{skill_md.parent}: missing security-manifest.json")
                  continue
              manifested += 1
              try:
                  data = json.loads(manifest_path.read_text())
              except Exception as exc:
                  errors.append(f"{manifest_path}: invalid JSON: {exc}")
                  continue
              if data.get("version") != 1:
                  errors.append(f"{manifest_path}: version must be 1")
              if data.get("risk_tier") not in valid_tiers:
                  errors.append(f"{manifest_path}: invalid risk_tier")
              caps = data.get("capabilities")
              if not isinstance(caps, dict):
                  errors.append(f"{manifest_path}: capabilities must be an object")
                  continue
              for key in ("filesystem_read","filesystem_write","network_hosts","shell_commands","tools","requires_human_approval"):
                  if key in caps and not isinstance(caps[key], list):
                      errors.append(f"{manifest_path}: capabilities.{key} must be an array")

          if errors:
              raise SystemExit("\n".join(errors))
          print(f"PASS: manifests required for all {len(required)} inventory-listed packages; {manifested} existing manifests structurally valid.")
          print(f"Coverage gap: {len(all_skills - required)} packages outside the historical baseline; {len(all_skills) - manifested} packages without manifests.")
          PY

      - name: Select trusted auditor and audit changed skills (pull request)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/trusted-skill-auditor
          mkdir -p /tmp/trusted-skill-auditor

          if git cat-file -e "${BASE_SHA}:atomic-skills/skill-security-auditor/scripts/audit_skill.py" 2>/dev/null; then
            git archive "${BASE_SHA}" atomic-skills/skill-security-auditor | tar -x -C /tmp/trusted-skill-auditor
            AUDITOR=/tmp/trusted-skill-auditor/atomic-skills/skill-security-auditor/scripts/audit_skill.py
          else
            AUDITOR=atomic-skills/skill-security-auditor/scripts/audit_skill.py
            echo 'Bootstrap mode: base revision has no auditor yet; independent review is required.'
          fi

          python3 "${AUDITOR}"             --repo-root .             --changed-from "${BASE_SHA}"             --changed-to "${HEAD_SHA}"             --fail-on high             --report /tmp/skill-security-report.json

          cat /tmp/skill-security-report.json

      - name: Audit changed skills (push)
        if: github.event_name == 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 atomic-skills/skill-security-auditor/scripts/audit_skill.py             --repo-root .             --changed-from "${BASE_SHA}"             --changed-to "${HEAD_SHA}"             --fail-on high             --report /tmp/skill-security-report.json
          cat /tmp/skill-security-report.json
