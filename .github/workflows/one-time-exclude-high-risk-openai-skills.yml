name: One-time exclude high-risk imported skills

on:
  push:
    branches:
      - import/openai-plugin-skills-20260923
    paths:
      - '.github/workflows/one-time-exclude-high-risk-openai-skills.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout import branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: import/openai-plugin-skills-20260923

      - name: Exclude packages blocked by security audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path

          blocked = ["aiq-deploy","boltz-cli-setup","canva-edit-design","chunk","cloudflare","coderabbit-review","comps-valuation","deck-report-qc","dynamo-router-starter","expo-api-routes","meeting-sdk","narrator","native-data-fetching","nemoclaw-user-get-started","oauth","omniverse-cad-to-simready","omniverse-realtime-viewer","rest-api","sandbox-sdk","temporal-developer","temporal-serverless"]
          manifest_path = Path("docs/imports/openai-plugins-skills.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          imported = manifest.get("imported", [])
          kept = []
          excluded = list(manifest.get("excluded_by_security_audit", []))
          excluded_names = {x.get("target_skill") for x in excluded}

          for item in imported:
              name = item.get("target_skill")
              if name in blocked:
                  p = Path("skills") / name
                  if p.exists():
                      shutil.rmtree(p)
                  if name not in excluded_names:
                      excluded.append({
                          **item,
                          "security_gate": "high",
                          "status": "excluded",
                      })
              else:
                  kept.append(item)

          manifest["imported"] = kept
          manifest["imported_count"] = len(kept)
          manifest["excluded_by_security_audit"] = excluded
          manifest["excluded_by_security_audit_count"] = len(excluded)
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          Path(".github/workflows/one-time-exclude-high-risk-openai-skills.yml").unlink()

          expected = 502
          accounted = (
              manifest["imported_count"]
              + manifest.get("skipped_existing_count", 0)
              + manifest["excluded_by_security_audit_count"]
          )
          if accounted != expected:
              raise SystemExit(f"Manifest accounting mismatch: {accounted} != {expected}")

          print(json.dumps({
              "imported_count": manifest["imported_count"],
              "skipped_existing_count": manifest.get("skipped_existing_count", 0),
              "excluded_count": manifest["excluded_by_security_audit_count"],
          }, indent=2))
          PY

      - name: Commit security exclusions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: exclude high-risk imported skills"
          git push origin HEAD:import/openai-plugin-skills-20260923
